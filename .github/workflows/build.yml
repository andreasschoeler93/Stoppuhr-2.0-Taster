name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: pio-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install platformio

      - name: Firmware bauen
        run: pio run -e seeed_xiao_esp32s3

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/seeed_xiao_esp32s3/firmware.bin
